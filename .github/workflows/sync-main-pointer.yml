name: Sync production pointer

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Point main at the latest website source commit
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main master
          git checkout -B main origin/main
          git update-index --add --cacheinfo 160000,$SOURCE_SHA,tender-telescope
          if git diff --cached --quiet; then
            echo "Production pointer already current."
          else
            git commit -m "chore: sync production pointer to $SOURCE_SHA"
            git push origin HEAD:main
          fi
