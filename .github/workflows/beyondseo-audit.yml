name: BeyondSEO full-site 32-worker audit

on:
  push:
    branches:
      - master
    paths:
      - src/**
      - public/**
      - astro.config.mjs
      - package.json
      - package-lock.json
      - .github/workflows/beyondseo-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beyondseo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out website source
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare BeyondSEO runtime
        run: |
          python .claude/skills/beyondseo/scripts/setup.py \
            --venv "$RUNNER_TEMP/beyondseo-runtime"

      - name: Run BeyondSEO full-site audit with 32 workers
        id: crawl
        continue-on-error: true
        run: |
          rm -rf "$GITHUB_WORKSPACE/beyondseo-audit"
          python .claude/skills/beyondseo/scripts/run.py \
            --runtime "$RUNNER_TEMP/beyondseo-runtime" \
            crawl https://agecalculatorkit.com \
            --include-www \
            --audit-depth deep \
            --max-pages 500 \
            --workers 32 \
            --mode auto \
            --out "$GITHUB_WORKSPACE/beyondseo-audit"

      - name: Show audit summary
        if: always()
        run: |
          echo "=== BeyondSEO summary.json ==="
          if [ -f beyondseo-audit/summary.json ]; then cat beyondseo-audit/summary.json; fi
          echo "=== BeyondSEO readiness.md ==="
          if [ -f beyondseo-audit/readiness.md ]; then cat beyondseo-audit/readiness.md; fi
          echo "=== BeyondSEO report.md ==="
          if [ -f beyondseo-audit/report.md ]; then sed -n '1,260p' beyondseo-audit/report.md; fi

      - name: Capture canonical host and security headers
        if: always()
        run: |
          {
            for url in \
              "https://agecalculatorkit.com/" \
              "https://www.agecalculatorkit.com/" \
              "https://agecalculatorkit.com/date-difference/" \
              "https://www.agecalculatorkit.com/date-difference/" \
              "https://agecalculatorkit.com/robots.txt" \
              "https://agecalculatorkit.com/sitemap-index.xml"; do
              echo "===== $url ====="
              curl -sS -I -L --max-redirs 5 "$url" || true
              echo
            done
          } > beyondseo-audit/host-diagnostics.txt

      - name: Upload BeyondSEO audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beyondseo-agecalculatorkit-full-site
          path: beyondseo-audit/
          if-no-files-found: warn
          retention-days: 14
