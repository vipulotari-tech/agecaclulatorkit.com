name: Fix dependency advisories

on:
  push:
    branches: [feat/seo-premium-traffic]
    paths:
      - .github/workflows/fix-dependencies.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/seo-premium-traffic
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install compatible patched toolchain
        run: |
          npm install --save-exact astro@7.3.5 @astrojs/cloudflare@14.3.3 wrangler@4.142.0
          npm audit fix || true
      - name: Verify math and production build
        run: npm run verify
      - name: Require clean high/critical production audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit dependency fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency files changed."
          else
            git commit -m "security: update vulnerable dependencies"
            git push origin HEAD:feat/seo-premium-traffic
          fi
