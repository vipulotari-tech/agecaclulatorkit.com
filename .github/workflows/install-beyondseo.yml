name: Install BeyondSEO project skill

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-beyondseo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website source branch
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone official BeyondSEO
        run: |
          rm -rf /tmp/beyondseo
          git clone --depth 1 https://github.com/beyondtahir/beyondseo.git /tmp/beyondseo

      - name: Install BeyondSEO into Claude Code project skills
        run: |
          python /tmp/beyondseo/scripts/install_skill.py \
            --host claude-code \
            --workspace "$GITHUB_WORKSPACE"
          test -f .claude/skills/beyondseo/SKILL.md
          test -f .claude/skills/beyondseo/beyondseo-install.json

      - name: Commit installed skill to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/skills/beyondseo
          if git diff --cached --quiet; then
            echo "BeyondSEO is already current."
          else
            git commit -m "chore: update BeyondSEO project skill"
            git push origin HEAD:master
          fi

      - name: Production sync note
        run: |
          echo "The normal Sync production branch workflow copies master to main after any committed skill update."
