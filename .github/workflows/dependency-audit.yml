name: Dependency audit

on:
  push:
    branches: [master]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: |
          npm audit --omit=dev --json > audit-production.json || true
          cat audit-production.json
      - name: Full dependency audit
        run: |
          npm audit --json > audit-full.json || true
          cat audit-full.json
