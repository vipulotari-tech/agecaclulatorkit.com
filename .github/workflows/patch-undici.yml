name: Patch transitive Undici

on:
  push:
    branches: [feat/seo-premium-traffic]
    paths:
      - .github/workflows/patch-undici.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/seo-premium-traffic
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Override vulnerable Miniflare Undici patch
        run: |
          npm pkg set overrides.miniflare.undici=7.29.1
          npm install
      - name: Verify site and calendar logic
        run: npm run verify
      - name: Require clean dependency audit
        run: npm audit --audit-level=moderate
      - name: Commit tested override
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: patch transitive undici advisory"
          git push origin HEAD:feat/seo-premium-traffic
